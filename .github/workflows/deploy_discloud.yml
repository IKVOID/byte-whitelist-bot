name: Deploy to Discloud

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'bot.py'
      - 'requirements.txt'
      - 'discloud.config'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Environment File
        run: |
          cat << 'EOF' > .env
          DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}
          API_KEY=${{ secrets.API_KEY }}
          API_BASE_URL=https://mani272uidbypass.vercel.app/api/v1/uids
          EOF

      - name: Package Bot Zip
        run: |
          zip -r discloud_upload.zip discloud.config bot.py requirements.txt .env config.json

      - name: Deploy via Discloud Official SDK
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
        run: |
          npm install discloud.app
          node -e '
            const { discloud } = require("discloud.app");
            (async () => {
              try {
                await discloud.login(process.env.DISCLOUD_TOKEN);
                console.log("Logged in to Discloud!");
                const user = await discloud.user.fetch();
                console.log("User:", user.username, "Total RAM:", user.totalRamMb);

                console.log("Uploading discloud_upload.zip to Discloud...");
                const result = await discloud.apps.create({
                  file: "./discloud_upload.zip"
                });
                console.log("SUCCESS:", JSON.stringify(result, null, 2));
              } catch (err) {
                console.error("Discloud Deploy Error:", err);
                process.exit(1);
              }
            })();
          '
